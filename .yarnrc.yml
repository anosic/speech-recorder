nodeLinker: node-modules

# No dependency needs an install script: onnxruntime-node ships its CPU binaries in the package (its postinstall
# only fetches optional GPU libraries) and esbuild installs its platform binary as an optional dependency.
enableScripts: false

# @huggingface/transformers requires onnxruntime-common without declaring it. Keep in step with the
# onnxruntime-node version transformers depends on.
packageExtensions:
  "@huggingface/transformers@*":
    dependencies:
      onnxruntime-common: "1.30.0"
